<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <rect width="960" height="560" fill="#fbfaf7"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
  <text x="480" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#222">AI 团队怎么分工</text>
  <!-- 你 -->
  <rect x="380" y="70" width="200" height="80" rx="12" fill="#c8553d"/>
  <text x="480" y="104" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">你（老板）</text>
  <text x="480" y="132" text-anchor="middle" font-size="14" fill="#fff">给目标和方向 · 只判断结果</text>
  <!-- 任务单 -->
  <rect x="80" y="230" width="190" height="80" rx="12" fill="#e08e45"/>
  <text x="175" y="264" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">任务单</text>
  <text x="175" y="290" text-anchor="middle" font-size="14" fill="#fff">要什么 · 做完的标准</text>
  <!-- 干的 AI -->
  <rect x="385" y="230" width="190" height="80" rx="12" fill="#4a6fa5"/>
  <text x="480" y="264" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">干活的 AI</text>
  <text x="480" y="290" text-anchor="middle" font-size="14" fill="#fff">自己拆步骤 · 记进度</text>
  <!-- 查的 AI -->
  <rect x="690" y="230" width="190" height="80" rx="12" fill="#7a9e7e"/>
  <text x="785" y="264" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">查的 AI</text>
  <text x="785" y="290" text-anchor="middle" font-size="14" fill="#fff">全新对话或另一个 AI</text>
  <!-- 箭头 -->
  <path d="M400,150 C300,170 220,190 190,228" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="196" y="190" font-size="14" fill="#333" text-anchor="end">写清楚一件事</text>
  <line x1="270" y1="270" x2="383" y2="270" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="575" y1="262" x2="688" y2="262" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="632" y="252" text-anchor="middle" font-size="14" fill="#333">交产出</text>
  <line x1="688" y1="290" x2="577" y2="290" stroke="#a33" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="632" y="336" text-anchor="middle" font-size="14" fill="#a33">不过：只退回这一步</text>
  <path d="M785,228 C770,180 680,140 582,118" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="760" y="140" font-size="14" fill="#333">通过：把结论</text><text x="760" y="160" font-size="14" fill="#333">和证据交给你</text>
  <!-- 地基 -->
  <rect x="80" y="390" width="800" height="120" rx="12" fill="#ece7dd" stroke="#bbb"/>
  <text x="480" y="424" text-anchor="middle" font-size="20" font-weight="700" fill="#333">大家共用的地基</text>
  <text x="480" y="456" text-anchor="middle" font-size="15" fill="#333">宪法（目标和规矩）· 技能（做法说明书）· 记忆卡（踩过的坑）· 进度记录（谁都能接着干）</text>
  <text x="480" y="486" text-anchor="middle" font-size="14" fill="#666">以后再加：定时派活的“中台”、手机上随时下指令</text>
  <line x1="480" y1="388" x2="480" y2="312" stroke="#999" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="175" y1="388" x2="175" y2="312" stroke="#999" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="785" y1="388" x2="785" y2="312" stroke="#999" stroke-width="2" stroke-dasharray="4 4"/>
</svg>
